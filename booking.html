<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشكاة">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="logo.png">
<title>حجز حصة | منصة مشكاة التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6fb;--card:#fff;--line:#e3e8f0;--text:#14233f;--muted:#64748b;--navy:#1e3a5f;--navy-d:#14233f;--gold:#d4af37;--grad:linear-gradient(135deg,#1e3a5f,#d4af37);--shadow:0 10px 30px rgba(20,35,63,.08)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.container{max-width:900px;margin:auto;padding:0 20px}
.top{position:sticky;top:0;z-index:10;background:var(--navy-d);border-bottom:1px solid rgba(212,175,55,.2)}
.top-wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#fff}
.logo img{width:46px;height:46px;object-fit:contain}
.logo b{background:linear-gradient(90deg,#d4af37,#f5e6a8);-webkit-background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer;transition:.3s;border:none}
.btn-ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(212,175,55,.3);color:#f5e6a8}
.btn-ghost:hover{background:rgba(212,175,55,.15)}
.btn-danger{background:rgba(255,255,255,.05);border:1.5px solid rgba(239,68,68,.4);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-primary{width:100%;justify-content:center;padding:14px;background:var(--grad);color:#fff;box-shadow:0 10px 25px rgba(30,58,95,.3);font-size:15px}
.btn-primary:hover{transform:translateY(-3px)}
main{position:relative;z-index:1;padding:40px 0 70px}
.page-head{text-align:center;margin-bottom:28px}
.page-head h1{font-size:clamp(26px,4vw,40px);font-weight:900}
.page-head h1 i{color:var(--gold)}
.page-head p{color:var(--muted);margin-top:8px}
.card-glass{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.card-glass h2{font-size:17px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card-glass h2 i{color:var(--gold)}
.alert{display:none;padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:14px;font-weight:700}
.alert.error{background:#fef2f2;border:1px solid #fecaca;color:#b42318}
.alert.success{background:#ecfdf3;border:1px solid #abefc6;color:#067647}
.field{margin-bottom:12px;text-align:right}
.field label{display:block;font-weight:800;font-size:12.5px;margin-bottom:5px;color:#344054}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px}
.item-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.item-top b{font-size:15px;font-weight:900}
.st{font-size:11px;font-weight:900;padding:4px 12px;border-radius:50px}
.st.pending{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.st.approved{background:#ecfdf3;color:#067647;border:1px solid #abefc6}
.st.cancelled{background:#fef2f2;color:#b42318;border:1px solid #fecaca}
.item-meta{color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:10px}
.no{border-radius:10px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;background:none;border:1.5px solid #fecaca;color:#b91c1c}
.no:hover{background:#fef2f2}
.muted{color:var(--muted);font-size:14px}
.mt{margin-top:26px}
</style>
</head>
<body>
<header class="top">
  <div class="container top-wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="مشكاة" onerror="this.style.display='none'"><span>منصة <b>مشكاة</b></span></a>
    <div class="top-actions">
      <a href="dashboard.html" class="btn btn-ghost"><i class="fa-solid fa-gauge-high"></i> لوحتك</a>
      <button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>
</header>
<main class="container">
  <section class="page-head">
    <h1>حجز حصة <i class="fa-solid fa-calendar-check"></i></h1>
    <p>اختار مدرسك وموعدك — وهنأكدلك الحجز في أقرب وقت</p>
  </section>
  <div class="card-glass">
    <h2><i class="fa-solid fa-circle-plus"></i> حجز جديد</h2>
    <div class="alert error" id="errBox"></div>
    <div class="alert success" id="okBox"></div>
    <form id="bookForm" novalidate>
      <div class="field"><label>المدرس</label><select id="doctor"><option value="">اختار المدرس…</option></select></div>
      <div class="row">
        <div class="field"><label>التاريخ</label><input id="date" type="date"></div>
        <div class="field"><label>الوقت</label><input id="time" type="time"></div>
      </div>
      <button class="btn btn-primary" id="submitBtn" type="submit"><span>إرسال الحجز <i class="fa-solid fa-paper-plane"></i></span></button>
    </form>
  </div>
  <div class="card-glass mt">
    <h2><i class="fa-solid fa-list-check"></i> حجوزاتي</h2>
    <div id="myBooks" class="list"><p class="muted">ثواني بنحمّل…</p></div>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  const $=id=>document.getElementById(id);let me=null;
  auth.onAuthStateChanged(async user=>{
    if(!user){location.href='login.html';return;}
    let data={};try{data=JSON.parse(localStorage.getItem('bw_user')||'{}')}catch(e){}
    try{const s=await db.collection('profiles').doc(user.uid).get();if(s.exists)Object.assign(data,s.data())}catch(e){}
    me={uid:user.uid,name:data.name||user.email.split('@')[0]};loadTeachers();loadMyBooks();
  });
  async function loadTeachers(){
    try{const snap=await db.collection('teachers').get();const arr=[];snap.forEach(d=>arr.push(d.data()));
      if(arr.length){$('doctor').innerHTML='<option value="">اختار المدرس…</option>'+arr.map(t=>`<option>${t.name} — ${t.subject||''}</option>`).join('');}
      else{$('doctor').innerHTML='<option value="">مفيش مدرسين حاليًا</option>';}}catch(e){}
  }
  $('bookForm').addEventListener('submit',async e=>{
    e.preventDefault();$('errBox').style.display='none';$('okBox').style.display='none';
    const doctor=$('doctor').value,date=$('date').value,time=$('time').value;
    if(!doctor){$('errBox').textContent='⚠️ اختار المدرس الأول.';$('errBox').style.display='block';return;}
    if(!date||!time){$('errBox').textContent='⚠️ اختار التاريخ والوقت.';$('errBox').style.display='block';return;}
    try{await db.collection('bookings').add({user_id:me.uid,student:me.name,doctor,date,time,status:'pending',createdAt:new Date().toISOString()});
      $('okBox').textContent='✅ حجزك اتبعت! هنأكدلك في أقرب وقت.';$('okBox').style.display='block';$('bookForm').reset();loadMyBooks();
    }catch(er){$('errBox').textContent='⚠️ '+((er&&er.message)||er);$('errBox').style.display='block';}
  });
  async function loadMyBooks(){
    const box=$('myBooks');
    try{const snap=await db.collection('bookings').where('user_id','==',me.uid).get();const arr=[];snap.forEach(d=>arr.push(Object.assign({id:d.id},d.data())));
      arr.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      if(!arr.length){box.innerHTML='<p class="muted">لسه مفيش حجوزات.</p>';return;}
      box.innerHTML=arr.map(b=>{const st=b.status==='approved'?'مؤكد':b.status==='cancelled'?'مرفوض':'قيد المراجعة';return `<div class="item"><div class="item-top"><b>${b.doctor}</b><span class="st ${b.status||'pending'}">${st}</span></div><p class="item-meta">${b.date?new Date(b.date).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'}):''} • ${b.time||''}</p>${b.status==='pending'?`<button class="no" data-id="${b.id}"><i class="fa-solid fa-xmark"></i> إلغاء الحجز</button>`:''}</div>`;}).join('');
      box.querySelectorAll('.no').forEach(btn=>btn.onclick=async()=>{if(confirm('إلغاء الحجز ده؟')){btn.disabled=true;await db.collection('bookings').doc(btn.dataset.id).delete();loadMyBooks();}});
    }catch(e){box.innerHTML='<p class="muted">خطأ في التحميل.</p>';}
  }
  $('logoutBtn').onclick=async()=>{localStorage.removeItem('bw_user');await auth.signOut();location.href='index.html';};
</script>
</body>
</html>
