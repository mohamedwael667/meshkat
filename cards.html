<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشكاة">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="logo.png">
<title>طباعة كارنيهات مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#eef1f7;padding:20px}
.toolbar{max-width:900px;margin:0 auto 24px;background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(20,35,63,.08)}
.toolbar h1{font-size:20px;margin-bottom:6px;color:#14233f}
.toolbar p{color:#64748b;font-size:13px;margin-bottom:12px;line-height:1.9}
.toolbar p b{color:#1e3a5f}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:10px 22px;border-radius:10px;background:#eef1f7;color:#64748b;font-weight:800;font-size:14px;border:none;cursor:pointer;font-family:inherit;transition:.3s}
.tab.on{background:linear-gradient(135deg,#1e3a5f,#d4af37);color:#fff}
select{width:100%;padding:12px;border-radius:12px;border:1.5px solid #e3e8f0;font-family:inherit;font-size:14px;background:#fff;margin-bottom:10px}
select:focus{outline:none;border-color:#d4af37}
.load-btn{width:100%;padding:12px;border:none;border-radius:12px;background:#1e3a5f;color:#d4af37;font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;transition:.3s}
.load-btn:hover{opacity:.9}
.count-info{margin-top:10px;font-size:13px;font-weight:800;color:#1e3a5f;background:#eef4ff;border:1px solid #bcd4f5;border-radius:10px;padding:8px 12px;display:none}
textarea{width:100%;height:150px;border:1.5px solid #e3e8f0;border-radius:12px;padding:12px;font-family:inherit;font-size:14px;resize:vertical;line-height:2}
textarea:focus{outline:none;border-color:#d4af37}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button.act{padding:12px 26px;border:none;border-radius:12px;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;transition:.3s}
.gen{background:linear-gradient(135deg,#1e3a5f,#d4af37);color:#fff}
.gen:hover{transform:translateY(-2px)}
.prn{background:#14233f;color:#d4af37}
.prn:hover{transform:translateY(-2px)}

/* ===== الكارنيه الاحترافي ===== */
.cards{display:grid;grid-template-columns:repeat(2,8.6cm);gap:.5cm;justify-content:center}
.id-card{width:8.6cm;height:5.4cm;border-radius:.35cm;background:linear-gradient(135deg,#0f1c33 0%,#14233f 45%,#1e3a5f 100%);color:#fff;position:relative;overflow:hidden;padding:.4cm .45cm .3cm;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 22px rgba(20,35,63,.3);outline:1px dashed #b9c4d6;outline-offset:5px}
.frame{position:absolute;inset:.14cm;border:1px solid rgba(212,175,55,.4);border-radius:.25cm;pointer-events:none}
.id-card::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(212,175,55,.09) 1px,transparent 1px);background-size:.35cm .35cm;pointer-events:none}
.id-card::after{content:'';position:absolute;top:-60%;right:-30%;width:70%;height:140%;background:linear-gradient(115deg,transparent 42%,rgba(245,230,168,.14) 50%,transparent 58%);pointer-events:none}
.row{display:flex;align-items:center;gap:.2cm;position:relative}
.logo-img{width:.85cm;height:.85cm;object-fit:contain}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:12.5px;color:#d4af37;font-weight:900}
.brand small{font-size:6.5px;color:#9fb3d1;font-weight:700;letter-spacing:1.5px;direction:ltr;text-align:right}
.badge{margin-right:auto;font-size:7.5px;font-weight:900;color:#14233f;background:linear-gradient(135deg,#f5e6a8,#d4af37);padding:.08cm .25cm;border-radius:.5cm}
.mid{justify-content:space-between;margin-top:.15cm}
.who{flex:1}
.who small{display:block;font-size:7px;color:#9fb3d1;font-weight:700;margin-bottom:.05cm}
.code{background:rgba(212,175,55,.1);border:1px dashed rgba(212,175,55,.65);border-radius:.15cm;padding:.15cm .2cm;text-align:center;font-size:24px;font-weight:900;letter-spacing:7px;color:#f5e6a8;direction:ltr}
.chip{width:.95cm;height:.72cm;border-radius:.12cm;background:linear-gradient(135deg,#f5e6a8,#d4af37 55%,#b8941f);position:relative;flex-shrink:0;box-shadow:inset 0 0 .1cm rgba(20,35,63,.4)}
.chip::before{content:'';position:absolute;inset:.13cm;border:1px solid rgba(20,35,63,.45);border-radius:.08cm}
.chip::after{content:'';position:absolute;top:50%;left:.13cm;right:.13cm;height:1px;background:rgba(20,35,63,.45)}
.bottom{justify-content:space-between;align-items:flex-end}
.lec{font-size:8.5px;color:#cbd5e1;font-weight:700}
.lec b{color:#d4af37;font-weight:900}
.by{font-size:8px;color:#9fb3d1;font-weight:700;direction:ltr;letter-spacing:.5px}
.by b{color:#d4af37;font-weight:900}

@media print{
  body{background:#fff;padding:0}
  .toolbar{display:none}
  .cards{gap:.45cm}
  .id-card{box-shadow:none;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@page{size:A4;margin:1cm}
</style>
</head>
<body>

<div class="toolbar">
  <h1>🖨️ طباعة كارنيهات مشكاة</h1>
  <p><b>من المنصة:</b> اختار المحاضرة → كل أكوادها تتطبع على كارنيهات جاهزة للتوزيع (من غير أسماء).<br>
  <b>يدوي:</b> كل سطر = كارنيه بالنظام: <b>الكود | المحاضرة | المادة | اسم المدرس</b></p>

  <div class="tabs">
    <button class="tab on" data-m="platform" onclick="setMode('platform')">🎯 من المنصة</button>
    <button class="tab" data-m="manual" onclick="setMode('manual')">✍️ إدخال يدوي</button>
  </div>

  <div id="panelPlatform">
    <select id="lecSelect"><option value="">— اختار محاضرة —</option></select>
    <button class="load-btn" id="loadCodes">⬇️ تحميل أكواد المحاضرة</button>
    <div class="count-info" id="countInfo"></div>
  </div>

  <div id="panelManual" style="display:none">
    <textarea id="data">12345678 | المحاضرة الأولى | رياضيات | أ. محمد أحمد
87654321 | المحاضرة الأولى | رياضيات | أ. محمد أحمد
11223344 | ملخص الباب الأول | فيزياء | أ. خالد سعيد</textarea>
  </div>

  <div class="btns">
    <button class="act gen" onclick="gen()">⚡ توليد الكارنيهات</button>
    <button class="act prn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
  </div>
</div>

<div class="cards" id="cards"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
const $=id=>document.getElementById(id);
const ADMIN_EMAIL="admin@benwael.com";
let IS_ADMIN=false,MY_EMAIL='',LECS=[],CURRENT={},CODES=[],mode='platform';

auth.onAuthStateChanged(async user=>{
  if(!user){location.href='login.html';return;}
  MY_EMAIL=user.email;IS_ADMIN=user.email===ADMIN_EMAIL;
  let role='';
  try{const s=await db.collection('profiles').doc(user.uid).get();if(s.exists)role=s.data().role||'';}catch(e){}
  if(!IS_ADMIN&&role!=='teacher'){alert('⚠️ الصفحة دي للأدمن والمدرسين بس.');location.href='index.html';return;}
  loadLectures();
});

async function loadLectures(){
  try{
    const snap=IS_ADMIN?await db.collection('lectures').get():await db.collection('lectures').where('teacherEmail','==',MY_EMAIL).get();
    LECS=[];snap.forEach(d=>LECS.push(Object.assign({id:d.id},d.data())));
    LECS.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    $('lecSelect').innerHTML='<option value="">— اختار محاضرة —</option>'+LECS.map(l=>`<option value="${l.id}">${l.title} (${l.subject||'مادة'}) — ${l.teacherName||''}</option>`).join('');
  }catch(e){}
}

$('loadCodes').onclick=async()=>{
  const id=$('lecSelect').value;
  if(!id){alert('اختار محاضرة الأول.');return;}
  const lec=LECS.find(l=>l.id===id)||{};
  CURRENT={lec:lec.title||'',sub:lec.subject||'',teacher:lec.teacherName||''};
  const snap=await db.collection('lecture_codes').where('lectureId','==',id).get();
  CODES=[];snap.forEach(d=>CODES.push(d.data()));
  $('countInfo').style.display='block';
  $('countInfo').textContent='✅ تم تحميل '+CODES.length+' كود — دوس "توليد" وبعدين اطبع ووزّع.';
  gen();
};

function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('panelPlatform').style.display=m==='platform'?'block':'none';
  $('panelManual').style.display=m==='manual'?'block':'none';
}

function gen(){
  let items=[];
  if(mode==='platform'){
    items=CODES.map(c=>({code:c.code,lec:CURRENT.lec,sub:CURRENT.sub,teacher:CURRENT.teacher}));
  }else{
    items=$('data').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const p=l.split('|').map(x=>x.trim());
      return {code:p[0]||'00000000',lec:p[1]||'',sub:p[2]||'',teacher:p[3]||''};
    });
  }
  if(!items.length){alert('مفيش بيانات — حمّل أكواد أو اكتب سطور.');return;}
  $('cards').innerHTML=items.map(it=>`
    <div class="id-card">
      <div class="frame"></div>
      <div class="row">
        <img src="logo.png" class="logo-img" onerror="this.style.display='none'">
        <div class="brand"><b>منصة مشكات</b><small>MESHKAT EDUCATION</small></div>
        <span class="badge">بطاقة وصول</span>
      </div>
      <div class="row mid">
        <div class="who">
          <small>كود الوصول الخاص بيك</small>
          <div class="code">${it.code}</div>
        </div>
        <div class="chip"></div>
      </div>
      <div class="row bottom">
        <span class="lec">${it.teacher?'<b>'+it.teacher+'</b> • ':''}${it.lec}${it.sub?' • '+it.sub:''}</span>
        <span class="by">by <b>Ben Wael</b></span>
      </div>
    </div>`).join('');
}
gen();
</script>
</body>
</html>
