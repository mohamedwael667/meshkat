<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشكاة">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="logo.png">
<title>نشر الأخبار | منصة مشكاة التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6fb;--card:#fff;--line:#e3e8f0;--text:#14233f;--muted:#64748b;--navy:#1e3a5f;--navy-d:#14233f;--gold:#d4af37;--grad:linear-gradient(135deg,#1e3a5f,#d4af37);--shadow:0 10px 30px rgba(20,35,63,.08)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.container{max-width:800px;margin:auto;padding:0 20px}
.top{position:sticky;top:0;z-index:10;background:var(--navy-d);border-bottom:1px solid rgba(212,175,55,.2)}
.top-wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#fff}
.logo img{width:46px;height:46px;object-fit:contain}
.logo b{background:linear-gradient(90deg,#d4af37,#f5e6a8);-webkit-background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer;transition:.3s;border:none}
.btn-ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(212,175,55,.3);color:#f5e6a8}
.btn-ghost:hover{background:rgba(212,175,55,.15)}
.btn-danger{background:rgba(255,255,255,.05);border:1.5px solid rgba(239,68,68,.4);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-primary{width:100%;justify-content:center;padding:14px;background:var(--grad);color:#fff;box-shadow:0 10px 25px rgba(30,58,95,.3);font-size:15px}
.btn-primary:hover{transform:translateY(-3px)}
main{position:relative;z-index:1;padding:40px 0 70px}
.page-head{text-align:center;margin-bottom:28px}
.page-head h1{font-size:clamp(22px,4vw,34px);font-weight:900}
.page-head h1 i{color:var(--gold)}
.card-glass{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.card-glass h2{font-size:17px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card-glass h2 i{color:var(--gold)}
.alert{display:none;padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:14px;font-weight:700}
.alert.error{background:#fef2f2;border:1px solid #fecaca;color:#b42318}
.alert.success{background:#ecfdf3;border:1px solid #abefc6;color:#067647}
.field{margin-bottom:12px;text-align:right}
.field label{display:block;font-weight:800;font-size:12.5px;margin-bottom:5px;color:#344054}
.field input,.field textarea{width:100%;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:var(--text);font-family:inherit;font-size:14.5px;outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.15)}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px;align-items:center}
.item-top b{font-size:15px;font-weight:900}
.item-meta{color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:10px}
.no{border-radius:10px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;background:none;border:1.5px solid #fecaca;color:#b91c1c}
.no:hover{background:#fef2f2}
.muted{color:var(--muted);font-size:14px}
.mt{margin-top:26px}
.spinner{display:none;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn.loading .spinner{display:inline-block}.btn.loading{pointer-events:none;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <div class="container top-wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="مشكاة" onerror="this.style.display='none'"><span>منصة <b>مشكاة</b></span></a>
    <div class="top-actions">
      <a href="admin.html" class="btn btn-ghost"><i class="fa-solid fa-gauge-high"></i> لوحة الأدمن</a>
      <button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>
</header>
<main class="container">
  <section class="page-head"><h1>نشر خبر جديد <i class="fa-solid fa-bullhorn"></i></h1></section>
  <div id="adminArea">
    <div class="card-glass">
      <h2><i class="fa-solid fa-circle-plus"></i> خبر جديد</h2>
      <div class="alert error" id="errBox"></div>
      <div class="alert success" id="okBox"></div>
      <form id="newsForm" novalidate>
        <div class="field"><label>عنوان الخبر</label><input id="nTitle" placeholder="مثال: إعلان جدول امتحانات الفصل الدراسي الأول"></div>
        <div class="field"><label>نص الخبر</label><textarea id="nContent" rows="5" placeholder="اكتب تفاصيل الخبر هنا..."></textarea></div>
        <div class="field"><label>صورة الخبر (اختياري — رابط من Google Drive)</label><input id="nImage" dir="ltr" placeholder="https://drive.google.com/..."></div>
        <button class="btn btn-primary" id="submitNews" type="submit"><span>نشر الخبر <i class="fa-solid fa-paper-plane"></i></span><span class="spinner"></span></button>
      </form>
    </div>
    <div class="card-glass mt">
      <h2><i class="fa-solid fa-newspaper"></i> الأخبار المنشورة</h2>
      <div id="newsList" class="list"><p class="muted">ثواني بنحمّل…</p></div>
    </div>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  const ADMIN_EMAIL="admin@benwael.com";
  const $=id=>document.getElementById(id);
  auth.onAuthStateChanged(user=>{
    if(!user){location.href='login.html';return;}
    if(user.email!==ADMIN_EMAIL){$('adminArea').innerHTML='<div style="text-align:center;padding:60px"><i class="fa-solid fa-lock" style="font-size:44px;color:var(--gold);display:block;margin-bottom:16px"></i><h2>مفيش صلاحية أدمن</h2></div>';return;}
    loadNews();
  });
  function toImg(u){if(!u)return'';if(u.includes('drive.google.com')){const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);if(m)return'https://lh3.googleusercontent.com/d/'+m[1];}return u;}
  $('newsForm').addEventListener('submit',async e=>{
    e.preventDefault();$('errBox').style.display='none';$('okBox').style.display='none';
    const title=$('nTitle').value.trim(),content=$('nContent').value.trim(),image=toImg($('nImage').value.trim());
    if(!title||!content){$('errBox').textContent='⚠️ اكتب عنوان الخبر ونصه.';$('errBox').style.display='block';return;}
    $('submitNews').classList.add('loading');
    try{
      await db.collection('news').add({title,content,image,createdAt:new Date().toISOString()});
      $('okBox').textContent='✅ الخبر اتنشر! الطلاب هيظهرلهم الجرس والإشعار دلوقتي.';$('okBox').style.display='block';
      $('newsForm').reset();loadNews();
    }catch(er){$('errBox').textContent='⚠️ '+((er&&er.message)||er);$('errBox').style.display='block';}
    finally{$('submitNews').classList.remove('loading');}
  });
  async function loadNews(){
    const box=$('newsList');
    try{
      const snap=await db.collection('news').get();const arr=[];snap.forEach(d=>arr.push(Object.assign({id:d.id},d.data())));
      arr.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      if(!arr.length){box.innerHTML='<p class="muted">لسه مفيش أخبار منشورة.</p>';return;}
      box.innerHTML=arr.map(n=>`<div class="item"><div class="item-top"><b>${n.title}</b></div><p class="item-meta">${new Date(n.createdAt).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})}${n.image?' • 📷 بصورة':''}</p><button class="no" data-id="${n.id}"><i class="fa-solid fa-trash"></i> حذف</button></div>`).join('');
      box.querySelectorAll('.no').forEach(btn=>btn.onclick=async()=>{if(confirm('حذف الخبر ده؟')){btn.disabled=true;await db.collection('news').doc(btn.dataset.id).delete();loadNews();}});
    }catch(e){box.innerHTML='<p class="muted">خطأ في التحميل.</p>';}
  }
  $('logoutBtn').onclick=async()=>{localStorage.removeItem('bw_user');await auth.signOut();location.href='index.html';};
</script>
</body>
</html>
