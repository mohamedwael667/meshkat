<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشكاة">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="logo.png">
<title>لوحة المدرس | منصة مشكات التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6fb;--card:#fff;--line:#e3e8f0;--text:#14233f;--muted:#64748b;--navy:#1e3a5f;--navy-d:#14233f;--gold:#d4af37;--grad:linear-gradient(135deg,#1e3a5f,#d4af37);--shadow:0 10px 30px rgba(20,35,63,.08)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.container{max-width:1100px;margin:auto;padding:0 20px}
.top{position:sticky;top:0;z-index:10;background:var(--navy-d);border-bottom:1px solid rgba(212,175,55,.2)}
.top-wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#fff}
.logo img{width:46px;height:46px;object-fit:contain}
.logo b{background:linear-gradient(90deg,#d4af37,#f5e6a8);-webkit-background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer;transition:.3s;border:none}
.btn-ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(212,175,55,.3);color:#f5e6a8}
.btn-ghost:hover{background:rgba(212,175,55,.15)}
.btn-danger{background:rgba(255,255,255,.05);border:1.5px solid rgba(239,68,68,.4);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.15)}
main{padding:40px 0 70px;position:relative;z-index:1}
.welcome{display:flex;align-items:center;gap:22px;padding:32px;border-radius:26px;background:var(--grad);color:#fff;box-shadow:0 20px 50px rgba(30,58,95,.3);margin-bottom:26px;flex-wrap:wrap;position:relative;overflow:hidden}
.welcome::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:22px 22px}
.welcome>*{position:relative}
.avatar{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:900;color:var(--navy-d);background:#fff;flex-shrink:0;overflow:hidden}
.welcome h1{font-size:clamp(20px,3vw,28px);font-weight:900}
.welcome .muted{color:rgba(255,255,255,.85);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.stat i{font-size:24px;color:var(--gold);margin-bottom:10px;display:block}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{color:var(--muted);font-size:12px;font-weight:800}
.mgmt{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.mgmt a{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:.35s}
.mgmt a:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 15px 35px rgba(20,35,63,.1)}
.mgmt i{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:22px;color:#fff;background:var(--grad)}
.mgmt b{font-size:15px;font-weight:900}
.mgmt small{color:var(--muted);font-size:12px;font-weight:700}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.mgmt{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="container top-wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="مشكاة" onerror="this.style.display='none'"><span>منصة <b>مشكاة</b></span></a>
    <div class="top-actions">
      <a href="index.html" class="btn btn-ghost"><i class="fa-solid fa-house"></i> الرئيسية</a>
      <button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>
</header>
<main class="container">
  <section class="welcome">
    <div class="avatar" id="avatar">…</div>
    <div><h1 id="wName">ثواني…</h1><p class="muted" id="wSub">لوحة تحكم المدرس — تدير مادتك بس</p></div>
  </section>
  <div class="stats">
    <div class="stat"><i class="fa-solid fa-video"></i><b id="cLec">0</b><span>محاضراتي</span></div>
    <div class="stat"><i class="fa-solid fa-book-open"></i><b id="cSum">0</b><span>ملخصاتي</span></div>
    <div class="stat"><i class="fa-solid fa-file-pen"></i><b id="cQuiz">0</b><span>اختباراتي</span></div>
    <div class="stat"><i class="fa-solid fa-key"></i><b id="cUsed">0</b><span>أكواد مستخدمة</span></div>
  </div>
  <div class="mgmt">
    <a href="admin-lectures.html"><i class="fa-solid fa-video"></i><b>محاضراتي</b><small>إضافة + أكواد الوصول</small></a>
    <a href="admin-summaries.html"><i class="fa-solid fa-book-open"></i><b>ملخصاتي</b><small>ملخصات محمية</small></a>
    <a href="admin-quizzes.html"><i class="fa-solid fa-file-pen"></i><b>اختباراتي</b><small>أسئلة + تصحيح فوري</small></a>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  const $=id=>document.getElementById(id);
  const ADMIN_EMAIL="admin@benwael.com";
  auth.onAuthStateChanged(async user=>{
    if(!user){location.href='login.html';return;}
    let role='',name='';
    try{const s=await db.collection('profiles').doc(user.uid).get();if(s.exists){role=s.data().role||'';name=s.data().name||'';}}catch(e){}
    if(role!=='teacher'&&user.email!==ADMIN_EMAIL){location.href='dashboard.html';return;}
    $('wName').textContent='أهلاً، '+(name||'مدرس')+' 👋';
    try{
      const tSnap=await db.collection('teachers').where('email','==',user.email).get();
      if(!tSnap.empty){const td=tSnap.docs[0].data();if(td.photo){$('avatar').innerHTML=`<img src="${td.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.outerHTML='${(name||'م').charAt(0)}'">`;}}
      else{$('avatar').textContent=(name||'م').charAt(0);}
    }catch(e){$('avatar').textContent=(name||'م').charAt(0);}
    if(!$('avatar').querySelector('img')&&!$('avatar').textContent.trim())$('avatar').textContent=(name||'م').charAt(0);
    try{
      const [lec,sum,quiz,codes]=await Promise.all([
        db.collection('lectures').where('teacherEmail','==',user.email).get(),
        db.collection('summaries').where('teacherEmail','==',user.email).get(),
        db.collection('quizzes').where('teacherEmail','==',user.email).get(),
        db.collection('lecture_codes').get()
      ]);
      let used=0;codes.forEach(c=>{if(c.data().usedBy)used++;});
      $('cLec').textContent=lec.size;$('cSum').textContent=sum.size;$('cQuiz').textContent=quiz.size;$('cUsed').textContent=used;
    }catch(e){}
  });
  $('logoutBtn').onclick=async()=>{localStorage.removeItem('bw_user');await auth.signOut();location.href='index.html';};
</script>
</body>
</html>
