<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشكاة">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="logo.png">
<title>إدارة الاشتراكات | منصة مشكاة التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6fb;--card:#fff;--line:#e3e8f0;--text:#14233f;--muted:#64748b;--navy:#1e3a5f;--navy-d:#14233f;--gold:#d4af37;--grad:linear-gradient(135deg,#1e3a5f,#d4af37);--shadow:0 10px 30px rgba(20,35,63,.08)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.container{max-width:900px;margin:auto;padding:0 20px}
.top{position:sticky;top:0;z-index:10;background:var(--navy-d);border-bottom:1px solid rgba(212,175,55,.2)}
.top-wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#fff}
.logo img{width:46px;height:46px;object-fit:contain}
.logo b{background:linear-gradient(90deg,#d4af37,#f5e6a8);-webkit-background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer;transition:.3s;border:none}
.btn-ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(212,175,55,.3);color:#f5e6a8}
.btn-ghost:hover{background:rgba(212,175,55,.15)}
.btn-danger{background:rgba(255,255,255,.05);border:1.5px solid rgba(239,68,68,.4);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.15)}
main{position:relative;z-index:1;padding:40px 0 70px}
.page-head{text-align:center;margin-bottom:28px}
.page-head h1{font-size:clamp(22px,4vw,34px);font-weight:900}
.page-head h1 i{color:var(--gold)}
.card-glass{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.card-glass h2{font-size:17px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card-glass h2 i{color:var(--gold)}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px}
.item-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.item-top b{font-size:15px;font-weight:900}
.st{font-size:11px;font-weight:900;padding:4px 12px;border-radius:50px}
.st.pending{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.st.active{background:#ecfdf3;color:#067647;border:1px solid #abefc6}
.st.rejected{background:#fef2f2;color:#b42318;border:1px solid #fecaca}
.item-meta{color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:10px}
.item-actions{display:flex;gap:8px;flex-wrap:wrap}
.ok,.no,.wa{border-radius:10px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;transition:.3s;background:none}
.ok{border:1.5px solid #abefc6;color:#067647}.ok:hover{background:#ecfdf3}
.no{border:1.5px solid #fecaca;color:#b91c1c}.no:hover{background:#fef2f2}
.wa{border:1.5px solid #86efac;color:#128c7e}.wa:hover{background:#e7fbe9}
.muted{color:var(--muted);font-size:14px}
.mt{margin-top:26px}
</style>
</head>
<body>
<header class="top">
  <div class="container top-wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="مشكاة" onerror="this.style.display='none'"><span>منصة <b>مشكاة</b></span></a>
    <div class="top-actions">
      <a href="admin.html" class="btn btn-ghost"><i class="fa-solid fa-gauge-high"></i> لوحة الأدمن</a>
      <button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>
</header>
<main class="container">
  <section class="page-head"><h1>إدارة الاشتراكات <i class="fa-solid fa-crown"></i></h1></section>
  <div id="adminArea">
    <div class="card-glass">
      <h2><i class="fa-solid fa-hourglass-half"></i> طلبات قيد المراجعة</h2>
      <div id="pendList" class="list"><p class="muted">ثواني بنحمّل…</p></div>
    </div>
    <div class="card-glass mt">
      <h2><i class="fa-solid fa-crown"></i> الاشتراكات النشطة</h2>
      <div id="actList" class="list"><p class="muted">ثواني بنحمّل…</p></div>
    </div>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  const ADMIN_EMAIL="admin@benwael.com";
  const $=id=>document.getElementById(id);
  auth.onAuthStateChanged(user=>{
    if(!user){location.href='login.html';return;}
    if(user.email!==ADMIN_EMAIL){$('adminArea').innerHTML='<div style="text-align:center;padding:60px"><i class="fa-solid fa-lock" style="font-size:44px;color:var(--gold);display:block;margin-bottom:16px"></i><h2>مفيش صلاحية أدمن</h2></div>';return;}
    load();
  });
  async function load(){
    try{
      const snap=await db.collection('subscriptions').get();const arr=[];snap.forEach(d=>arr.push(Object.assign({id:d.id},d.data())));
      arr.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      const pend=arr.filter(s=>s.status==='pending'),act=arr.filter(s=>s.status==='active');
      $('pendList').innerHTML=pend.length?pend.map(s=>`<div class="item"><div class="item-top"><b>${s.student}</b><span class="st pending">قيد المراجعة</span></div><p class="item-meta">${s.plan==='term'?'ترم كامل — 200ج':'شهري — 75ج'} • 📱 ${s.phone}${s.ref?' • رقم العملية: '+s.ref:''} • ${new Date(s.createdAt).toLocaleDateString('ar-EG',{day:'numeric',month:'long'})}</p><div class="item-actions"><button class="ok" data-act="ok" data-id="${s.id}" data-uid="${s.user_id}" data-plan="${s.plan}"><i class="fa-solid fa-check"></i> تفعيل الاشتراك</button><a class="wa" href="https://wa.me/2${s.phone}" target="_blank"><i class="fa-brands fa-whatsapp"></i> واتساب الطالب</a><button class="no" data-act="no" data-id="${s.id}"><i class="fa-solid fa-xmark"></i> رفض</button></div></div>`).join(''):'<p class="muted">مفيش طلبات معلقة 🎉</p>';
      $('actList').innerHTML=act.length?act.map(s=>`<div class="item"><div class="item-top"><b>${s.student}</b><span class="st active">نشط</span></div><p class="item-meta">${s.plan==='term'?'ترم كامل':'شهري'} • بيخلص ${s.expiresAt?new Date(s.expiresAt).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'}):'—'}</p></div>`).join(''):'<p class="muted">لسه مفيش اشتراكات نشطة.</p>';
      document.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=async()=>{
        const id=btn.dataset.id;
        if(btn.dataset.act==='ok'){const days=btn.dataset.plan==='term'?120:30;const expiresAt=new Date(Date.now()+days*86400000).toISOString();btn.disabled=true;await db.collection('subscriptions').doc(id).update({status:'active',activatedAt:new Date().toISOString(),expiresAt});await db.collection('profiles').doc(btn.dataset.uid).update({subExpires:expiresAt});load();}
        else{if(confirm('رفض الطلب ده؟')){btn.disabled=true;await db.collection('subscriptions').doc(id).update({status:'rejected'});load();}}
      });
    }catch(e){console.warn(e);}
  }
  $('logoutBtn').onclick=async()=>{localStorage.removeItem('bw_user');await auth.signOut();location.href='index.html';};
</script>
</body>
</html>
