<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشكاة">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="logo.png">
<title>إدارة المدرسين | منصة مشكاة التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6fb;--card:#fff;--line:#e3e8f0;--text:#14233f;--muted:#64748b;--navy:#1e3a5f;--navy-d:#14233f;--gold:#d4af37;--grad:linear-gradient(135deg,#1e3a5f,#d4af37);--shadow:0 10px 30px rgba(20,35,63,.08)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.container{max-width:900px;margin:auto;padding:0 20px}
.top{position:sticky;top:0;z-index:10;background:var(--navy-d);border-bottom:1px solid rgba(212,175,55,.2)}
.top-wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#fff}
.logo img{width:46px;height:46px;object-fit:contain}
.logo b{background:linear-gradient(90deg,#d4af37,#f5e6a8);-webkit-background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer;transition:.3s;border:none}
.btn-ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(212,175,55,.3);color:#f5e6a8}
.btn-ghost:hover{background:rgba(212,175,55,.15)}
.btn-danger{background:rgba(255,255,255,.05);border:1.5px solid rgba(239,68,68,.4);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-primary{width:100%;justify-content:center;padding:14px;background:var(--grad);color:#fff;box-shadow:0 10px 25px rgba(30,58,95,.3);font-size:15px}
.btn-primary:hover{transform:translateY(-3px)}
main{position:relative;z-index:1;padding:40px 0 70px}
.page-head{text-align:center;margin-bottom:28px}
.page-head h1{font-size:clamp(22px,4vw,34px);font-weight:900}
.page-head h1 i{color:var(--gold)}
.card-glass{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.card-glass h2{font-size:17px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card-glass h2 i{color:var(--gold)}
.alert{display:none;padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:14px;font-weight:700}
.alert.error{background:#fef2f2;border:1px solid #fecaca;color:#b42318}
.alert.success{background:#ecfdf3;border:1px solid #abefc6;color:#067647}
.field{margin-bottom:12px;text-align:right}
.field label{display:block;font-weight:800;font-size:12.5px;margin-bottom:5px;color:#344054}
.field input,.field textarea{width:100%;padding:11px 13px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-box{background:#eef4ff;border:1px solid #bcd4f5;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--navy);font-weight:700;line-height:1.9}
.list{display:flex;flex-direction:column;gap:14px}
.t-item{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.t-ava{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;background:var(--grad);flex-shrink:0;overflow:hidden}
.t-info{flex:1;min-width:200px}
.t-info b{font-size:16px;font-weight:900;display:block}
.t-sub{display:inline-block;margin:6px 0;font-size:11px;font-weight:900;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;padding:3px 12px;border-radius:50px}
.t-info p{color:var(--muted);font-size:13px;line-height:1.7}
.no{border-radius:10px;padding:8px 14px;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;background:none;border:1.5px solid #fecaca;color:#b91c1c}
.no:hover{background:#fef2f2}
.muted{color:var(--muted);font-size:14px}
.mt{margin-top:26px}
.spinner{display:none;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn.loading .spinner{display:inline-block}.btn.loading{pointer-events:none;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <div class="container top-wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="مشكاة" onerror="this.style.display='none'"><span>منصة <b>مشكاة</b></span></a>
    <div class="top-actions">
      <a href="admin.html" class="btn btn-ghost"><i class="fa-solid fa-gauge-high"></i> لوحة الأدمن</a>
      <button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>
</header>
<main class="container">
  <section class="page-head"><h1>إدارة المدرسين <i class="fa-solid fa-chalkboard-user"></i></h1></section>
  <div id="adminArea">
    <div class="card-glass">
      <h2><i class="fa-solid fa-user-plus"></i> إضافة مدرس + حساب دخول</h2>
      <div class="info-box"><i class="fa-solid fa-circle-info"></i> لما تضيف مدرس، بيتعمله <b>حساب دخول خاص</b> بيه يقدر يدير مادته بس — سلّمه الإيميل والباسورد. الصورة اختياريًا من Google Drive.</div>
      <div class="alert error" id="errBox"></div>
      <div class="alert success" id="okBox"></div>
      <form id="tForm" novalidate>
        <div class="row">
          <div class="field"><label>اسم المدرس</label><input id="tName" placeholder="مثال: أ. محمد أحمد"></div>
          <div class="field"><label>المادة / التخصص</label><input id="tSubject" placeholder="مثال: رياضيات"></div>
        </div>
        <div class="field"><label>نبذة قصيرة (تظهر في الرئيسية)</label><textarea id="tBio" rows="2" placeholder="خبرة ١٠ سنوات..."></textarea></div>
        <div class="field"><label>صورة المدرس (رابط من Google Drive — اختياري)</label><input id="tPhoto" dir="ltr" placeholder="https://drive.google.com/file/d/..."></div>
        <div class="row">
          <div class="field"><label>إيميل دخول المدرس</label><input id="tEmail" dir="ltr" placeholder="teacher@example.com"></div>
          <div class="field"><label>باسورد مؤقت</label><input id="tPass" dir="ltr" placeholder="مثال: teacher123"></div>
        </div>
        <button class="btn btn-primary" id="submitBtn" type="submit"><span>إضافة المدرس <i class="fa-solid fa-plus"></i></span><span class="spinner"></span></button>
      </form>
    </div>
    <div class="card-glass mt">
      <h2><i class="fa-solid fa-chalkboard-user"></i> المدرسون على المنصة</h2>
      <div id="tList" class="list"><p class="muted">ثواني بنحمّل…</p></div>
    </div>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  const ADMIN_EMAIL="admin@benwael.com";
  const $=id=>document.getElementById(id);
  auth.onAuthStateChanged(user=>{
    if(!user){location.href='login.html';return;}
    if(user.email!==ADMIN_EMAIL){$('adminArea').innerHTML='<div style="text-align:center;padding:60px"><i class="fa-solid fa-lock" style="font-size:44px;color:var(--gold);display:block;margin-bottom:16px"></i><h2>مفيش صلاحية أدمن</h2></div>';return;}
    loadTeachers();
  });
  $('tForm').addEventListener('submit',async e=>{
    e.preventDefault();$('errBox').style.display='none';$('okBox').style.display='none';
    const name=$('tName').value.trim(),subject=$('tSubject').value.trim(),bio=$('tBio').value.trim();
    const email=$('tEmail').value.trim().toLowerCase(),pass=$('tPass').value;
    let photo=$('tPhoto').value.trim();
    if(photo.includes('drive.google.com')){const m=photo.match(/\/d\/([\w-]+)/)||photo.match(/[?&]id=([\w-]+)/);if(m)photo='https://lh3.googleusercontent.com/d/'+m[1];}
    if(!name||!subject){$('errBox').textContent='⚠️ اكتب اسم المدرس والمادة.';$('errBox').style.display='block';return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('errBox').textContent='⚠️ اكتب إيميل صحيح للمدرس.';$('errBox').style.display='block';return;}
    if(pass.length<6){$('errBox').textContent='⚠️ الباسورد لازم ٦ أحرف على الأقل.';$('errBox').style.display='block';return;}
    $('submitBtn').classList.add('loading');
    try{
      let uid;const sec=firebase.initializeApp(firebase.app().options,'mk-sec'+Date.now());
      try{const cred=await sec.auth().createUserWithEmailAndPassword(email,pass);uid=cred.user.uid;await sec.auth().signOut();}
      catch(er){if(er.code==='auth/email-already-in-use'){$('errBox').textContent='⚠️ الإيميل ده مستخدم قبل كده.';$('errBox').style.display='block';$('submitBtn').classList.remove('loading');return;}throw er;}
      await db.collection('profiles').doc(uid).set({name,email,phone:'',role:'teacher',subject,createdAt:new Date().toISOString()});
      await db.collection('teachers').add({name,subject,bio,email,photo,createdAt:new Date().toISOString()});
      $('okBox').innerHTML='✅ حساب المدرس اتعمل!<br>الإيميل: <b>'+email+'</b> • الباسورد: <b>'+pass+'</b><br>سلّمهم للمدرس — هيدخل ويدير مادته بس.';$('okBox').style.display='block';
      $('tForm').reset();loadTeachers();
    }catch(er){$('errBox').textContent='⚠️ '+((er&&er.message)||er);$('errBox').style.display='block';}
    finally{$('submitBtn').classList.remove('loading');}
  });
  async function loadTeachers(){
    const box=$('tList');
    try{
      const snap=await db.collection('teachers').get();const arr=[];snap.forEach(d=>arr.push(Object.assign({id:d.id},d.data())));
      arr.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
      if(!arr.length){box.innerHTML='<p class="muted">لسه مفيش مدرسين.</p>';return;}
      box.innerHTML=arr.map(t=>`<div class="t-item"><div class="t-ava">${t.photo?`<img src="${t.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.outerHTML='${(t.name||'م').trim().charAt(0)}'">`:(t.name||'م').trim().charAt(0)}</div><div class="t-info"><b>${t.name}</b><span class="t-sub">${t.subject||'مدرس'}</span><p>${t.email?'🔑 '+t.email+' • ':''}${t.bio||''}</p></div><button class="no" data-id="${t.id}"><i class="fa-solid fa-trash"></i> حذف</button></div>`).join('');
      box.querySelectorAll('.no').forEach(btn=>btn.onclick=async()=>{if(confirm('حذف المدرس من الرئيسية؟ (حساب الدخول لازم يتمسح من Firebase Console → Authentication)')){btn.disabled=true;await db.collection('teachers').doc(btn.dataset.id).delete();loadTeachers();}});
    }catch(e){box.innerHTML='<p class="muted">خطأ في التحميل.</p>';}
  }
  $('logoutBtn').onclick=async()=>{localStorage.removeItem('bw_user');await auth.signOut();location.href='index.html';};
</script>
</body>
</html>
