<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشكاة">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="logo.png">
<title>تسجيل الدخول | منصة مشكاة التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6fb;--line:#e3e8f0;--text:#14233f;--muted:#64748b;--navy:#1e3a5f;--gold:#d4af37;--grad:linear-gradient(135deg,#1e3a5f,#d4af37)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:40px 16px;position:relative;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:0}
.blob-1{width:420px;height:420px;background:radial-gradient(circle,#1e3a5f,transparent 65%);top:-120px;right:-100px;opacity:.2}
.blob-2{width:380px;height:380px;background:radial-gradient(circle,#d4af37,transparent 65%);bottom:-120px;left:-100px;opacity:.18}
.home-link{position:fixed;top:20px;right:22px;color:var(--muted);font-weight:800;font-size:14px;z-index:5}
.home-link:hover{color:var(--navy)}
.auth-card{position:relative;z-index:2;width:min(440px,94vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px 32px;box-shadow:0 20px 60px rgba(20,35,63,.1)}
.auth-logo{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto 6px}
h1{text-align:center;font-size:22px;font-weight:900}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 22px}
.alert{display:none;padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:14px;font-weight:700}
.alert.error{background:#fef3f2;border:1px solid #fecdca;color:#b42318}
.alert.success{background:#ecfdf3;border:1px solid #abefc6;color:#067647}
.field{margin-bottom:14px;text-align:right}
.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px;color:#344054}
.field input{width:100%;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:.3s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.15)}
.pass-wrap{position:relative}
.pass-wrap input{direction:ltr;text-align:left;padding-right:46px}
.eye{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;font-weight:900;font-size:16px;font-family:inherit;border:none;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 10px 25px rgba(30,58,95,.3);transition:.3s}
.btn:hover{transform:translateY(-3px)}
.spinner{display:none;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn.loading .spinner{display:inline-block}.btn.loading{pointer-events:none;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
.switch a{color:var(--navy);font-weight:900}
</style>
</head>
<body>
<a href="index.html" class="home-link"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
<div class="blob blob-1"></div><div class="blob blob-2"></div>
<div class="auth-card">
  <img class="auth-logo" src="logo.png" alt="مشكاة" onerror="this.style.display='none'">
  <h1>منصة مشكاة التعليمية</h1>
  <p class="sub">وحشتنا! كمّل من حيث وقفت</p>
  <div class="alert error" id="errBox"></div>
  <div class="alert success" id="okBox"></div>
  <form id="loginForm" novalidate>
    <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" dir="ltr" placeholder="you@example.com"></div>
    <div class="field"><label>كلمة المرور</label><div class="pass-wrap"><input id="pass" type="password" placeholder="******"><button type="button" class="eye" data-t="pass"><i class="fa-solid fa-eye"></i></button></div></div>
    <button class="btn" id="submitBtn" type="submit"><span>دخول <i class="fa-solid fa-right-to-bracket"></i></span><span class="spinner"></span></button>
  </form>
  <p class="switch">لسه معندكش حساب؟ <a href="register.html">أنشئ حسابك الآن</a></p>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  const $=id=>document.getElementById(id);const ADMIN_EMAIL="admin@benwael.com";
  document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.t);i.type=i.type==='password'?'text':'password';b.querySelector('i').className=i.type==='password'?'fa-solid fa-eye':'fa-solid fa-eye-slash';});
  const errBox=$('errBox'),okBox=$('okBox'),btn=$('submitBtn');
  const showErr=m=>{errBox.textContent='⚠️ '+m;errBox.style.display='block';okBox.style.display='none'};
  function arError(e){const c=(e&&e.code)||'';if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')return 'الإيميل أو كلمة المرور مش صحيحة.';if(c==='auth/invalid-email')return 'اكتب بريد إلكتروني صحيح.';if(c==='auth/network-request-failed')return 'مشكلة اتصال بالإنترنت.';if(c==='auth/too-many-requests')return 'محاولات كتير أوي — استنى دقيقة وجرّب تاني.';return 'حصلت مشكلة: '+((e&&e.message)||e);}
  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();errBox.style.display='none';
    const email=$('email').value.trim().toLowerCase(),pass=$('pass').value;
    if(!email||!pass)return showErr('اكتب الإيميل وكلمة المرور.');
    btn.classList.add('loading');
    try{const cred=await auth.signInWithEmailAndPassword(email,pass);
      let data={};try{const snap=await Promise.race([db.collection('profiles').doc(cred.user.uid).get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6000))]);if(snap.exists)data=snap.data();}catch(_){}
      const name=data.name||email.split('@')[0];const role=email===ADMIN_EMAIL?'admin':(data.role||'student');
      localStorage.setItem('bw_user',JSON.stringify({name,email,role}));
      okBox.textContent='🎉 أهلاً بعودتك في مشكاة يا '+name.split(' ')[0]+'!';okBox.style.display='block';
      setTimeout(()=>{location.href=role==='admin'?'admin.html':(role==='teacher'?'teacher.html':'dashboard.html');},900);
    }catch(err){showErr(arError(err));}finally{btn.classList.remove('loading');}
  });
</script>
</body>
</html>
